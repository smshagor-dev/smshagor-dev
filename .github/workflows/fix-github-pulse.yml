name: Fix GitHub Pulse

on:
  push:
    paths:
      - '.github/workflows/fix-github-pulse.yml'

permissions:
  contents: write

jobs:
  fix-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate local GitHub Pulse artwork
        shell: bash
        run: |
          mkdir -p assets/pulse

          cat > assets/pulse/github-pulse.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" role="img" aria-labelledby="title desc">
            <title id="title">GitHub Pulse — smshagor-dev</title>
            <desc id="desc">A self-hosted developer activity card for Shahanur Islam Shagor.</desc>
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#080a0f"/>
                <stop offset="0.52" stop-color="#10131a"/>
                <stop offset="1" stop-color="#07090d"/>
              </linearGradient>
              <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#8f6f17"/>
                <stop offset="0.48" stop-color="#f3d36a"/>
                <stop offset="1" stop-color="#b88a1e"/>
              </linearGradient>
              <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
              <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
                <path d="M32 0H0V32" fill="none" stroke="#d4af37" stroke-opacity=".055"/>
              </pattern>
            </defs>
            <rect width="860" height="250" rx="22" fill="url(#bg)"/>
            <rect x="1" y="1" width="858" height="248" rx="21" fill="none" stroke="#3b3218" stroke-width="2"/>
            <rect width="860" height="250" rx="22" fill="url(#grid)"/>
            <circle cx="734" cy="56" r="86" fill="#d4af37" opacity=".04"/>
            <circle cx="734" cy="56" r="53" fill="none" stroke="#d4af37" stroke-opacity=".18"/>
            <circle cx="734" cy="56" r="31" fill="none" stroke="#54d7ff" stroke-opacity=".25"/>
            <circle cx="734" cy="56" r="6" fill="#f3d36a" filter="url(#glow)"/>
            <path d="M685 56h98M734 7v98" stroke="#54d7ff" stroke-opacity=".16"/>

            <text x="34" y="46" fill="#d4af37" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="700" letter-spacing="2">GITHUB PULSE // LIVE PROFILE SIGNAL</text>
            <text x="34" y="80" fill="#f5f7fa" font-family="Inter,Segoe UI,sans-serif" font-size="27" font-weight="700">smshagor-dev</text>
            <text x="34" y="104" fill="#8b949e" font-family="Consolas,Menlo,monospace" font-size="12">FULL-STACK • AI/ML • AUTONOMOUS SYSTEMS • SECURITY</text>

            <rect x="34" y="132" width="182" height="72" rx="14" fill="#0d1117" stroke="#2e2b20"/>
            <text x="51" y="157" fill="#8b949e" font-family="Consolas,Menlo,monospace" font-size="10" letter-spacing="1">ENGINEERING</text>
            <text x="51" y="184" fill="#f3d36a" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">Production Systems</text>

            <rect x="230" y="132" width="182" height="72" rx="14" fill="#0d1117" stroke="#2e2b20"/>
            <text x="247" y="157" fill="#8b949e" font-family="Consolas,Menlo,monospace" font-size="10" letter-spacing="1">RESEARCH</text>
            <text x="247" y="184" fill="#54d7ff" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">Applied AI + Edge</text>

            <rect x="426" y="132" width="182" height="72" rx="14" fill="#0d1117" stroke="#2e2b20"/>
            <text x="443" y="157" fill="#8b949e" font-family="Consolas,Menlo,monospace" font-size="10" letter-spacing="1">AUTONOMY</text>
            <text x="443" y="184" fill="#f5f7fa" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">Robotics + Fusion</text>

            <rect x="622" y="132" width="204" height="72" rx="14" fill="#0d1117" stroke="#2e2b20"/>
            <text x="639" y="157" fill="#8b949e" font-family="Consolas,Menlo,monospace" font-size="10" letter-spacing="1">SECURITY</text>
            <text x="639" y="184" fill="#f3d36a" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">Trust by Design</text>

            <rect x="34" y="222" width="792" height="3" rx="2" fill="#20252d"/>
            <rect x="34" y="222" width="566" height="3" rx="2" fill="url(#gold)" filter="url(#glow)"/>
            <text x="34" y="241" fill="#646d78" font-family="Consolas,Menlo,monospace" font-size="9">SELF-HOSTED ARTWORK • NO THIRD-PARTY STATS RENDERER REQUIRED</text>
          </svg>
          SVG

          cat > assets/pulse/stack-spectrum.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="860" height="210" viewBox="0 0 860 210" role="img" aria-labelledby="title desc">
            <title id="title">Engineering Stack Spectrum</title>
            <desc id="desc">Technology spectrum for smshagor-dev.</desc>
            <defs>
              <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#d4af37"/>
                <stop offset="0.52" stop-color="#55d6ff"/>
                <stop offset="1" stop-color="#d4af37"/>
              </linearGradient>
              <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0d12"/><stop offset="1" stop-color="#07090d"/></linearGradient>
            </defs>
            <rect width="860" height="210" rx="22" fill="url(#bg2)"/>
            <rect x="1" y="1" width="858" height="208" rx="21" fill="none" stroke="#3b3218" stroke-width="2"/>
            <text x="34" y="40" fill="#d4af37" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="700" letter-spacing="2">ENGINEERING STACK SPECTRUM</text>
            <text x="34" y="67" fill="#8b949e" font-family="Consolas,Menlo,monospace" font-size="11">WEB + BACKEND + AI + ROBOTICS + EDGE + SECURITY</text>

            <g font-family="Consolas,Menlo,monospace" font-size="11">
              <text x="34" y="106" fill="#e6edf3">TypeScript / Next.js / React</text>
              <rect x="267" y="96" width="525" height="10" rx="5" fill="#191d24"/><rect x="267" y="96" width="484" height="10" rx="5" fill="url(#bar)"/>
              <text x="34" y="132" fill="#e6edf3">Node / Laravel / Databases</text>
              <rect x="267" y="122" width="525" height="10" rx="5" fill="#191d24"/><rect x="267" y="122" width="452" height="10" rx="5" fill="url(#bar)"/>
              <text x="34" y="158" fill="#e6edf3">Python / ML / Computer Vision</text>
              <rect x="267" y="148" width="525" height="10" rx="5" fill="#191d24"/><rect x="267" y="148" width="437" height="10" rx="5" fill="url(#bar)"/>
              <text x="34" y="184" fill="#e6edf3">Autonomy / Edge / Security</text>
              <rect x="267" y="174" width="525" height="10" rx="5" fill="#191d24"/><rect x="267" y="174" width="419" height="10" rx="5" fill="url(#bar)"/>
            </g>
          </svg>
          SVG

      - name: Replace broken external Pulse cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          replacement = '''## <code>GitHub Pulse</code>

<div align="center">

<img src="./assets/pulse/github-pulse.svg" width="100%" alt="GitHub Pulse for smshagor-dev" />

<br/>

<img src="./assets/pulse/stack-spectrum.svg" width="100%" alt="Engineering stack spectrum" />

</div>'''

          pattern = re.compile(
              r'## <code>GitHub Pulse</code>\s*<div align="center">.*?</div>',
              re.S,
          )

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not locate exactly one GitHub Pulse section')

          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit repaired Pulse section
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/pulse/github-pulse.svg assets/pulse/stack-spectrum.svg
          git diff --cached --quiet && exit 0
          git commit -m "fix: replace broken GitHub Pulse images"
          git push
