<svg xmlns="http://www.w3.org/2000/svg" width="370" height="520" viewBox="0 0 370 520" role="img" aria-labelledby="title desc">
  <title id="title">Shahanur Islam Shagor — Developer Identity Panel</title>
  <desc id="desc">Professional code developer and AI engineering identity card for the GitHub profile of smshagor-dev.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090d"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f6f17"/>
      <stop offset="0.5" stop-color="#f2d36b"/>
      <stop offset="1" stop-color="#b88a1e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55d6ff"/>
      <stop offset="1" stop-color="#1f9fd1"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d4af37" stop-opacity=".16"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#d4af37" stroke-opacity=".035"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="368" height="518" rx="20" fill="url(#bg)" stroke="#3b3218" stroke-width="2"/>
  <rect x="1" y="1" width="368" height="518" rx="20" fill="url(#grid)"/>

  <!-- window chrome -->
  <circle cx="23" cy="24" r="4.5" fill="#ff5f57"/>
  <circle cx="39" cy="24" r="4.5" fill="#febc2e"/>
  <circle cx="55" cy="24" r="4.5" fill="#28c840"/>
  <text x="185" y="28" text-anchor="middle" fill="#737b86" font-family="Consolas,Menlo,monospace" font-size="9.5">dev://smshagor-dev/profile</text>
  <line x1="17" y1="43" x2="353" y2="43" stroke="#252a31"/>

  <!-- identity / developer core -->
  <circle cx="185" cy="112" r="68" fill="url(#halo)"/>
  <circle cx="185" cy="112" r="47" fill="#0a0e14" stroke="#66551f" stroke-width="1.5"/>
  <circle cx="185" cy="112" r="38" fill="none" stroke="#55d6ff" stroke-opacity=".18"/>
  <path d="M157 105l-17 14 17 14M213 105l17 14-17 14" fill="none" stroke="#55d6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M196 92l-22 54" stroke="#f2d36b" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="185" cy="112" r="3.5" fill="#f2d36b"/>

  <text x="185" y="177" text-anchor="middle" fill="#f5f7fa" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">SHAHANUR ISLAM SHAGOR</text>
  <text x="185" y="196" text-anchor="middle" fill="#d4af37" font-family="Consolas,Menlo,monospace" font-size="9.5" letter-spacing="1.2">FULL-STACK DEVELOPER • AI ENGINEER</text>

  <!-- terminal editor -->
  <rect x="19" y="218" width="332" height="144" rx="13" fill="#090d12" stroke="#29303a"/>
  <rect x="19" y="218" width="332" height="25" rx="13" fill="#10151c"/>
  <path d="M19 231h332v12H19z" fill="#10151c"/>
  <circle cx="35" cy="230" r="3" fill="#55d6ff"/>
  <text x="45" y="233" fill="#7e8792" font-family="Consolas,Menlo,monospace" font-size="8.5">~/workspace/core.ts</text>
  <text x="317" y="233" fill="#4fd18b" font-family="Consolas,Menlo,monospace" font-size="8">main</text>

  <g font-family="Consolas,Menlo,monospace" font-size="9.4">
    <text x="31" y="260" fill="#5f6873">01</text>
    <text x="54" y="260" fill="#d4af37">const</text>
    <text x="84" y="260" fill="#e6edf3"> engineer </text>
    <text x="131" y="260" fill="#7d8590">=</text>
    <text x="142" y="260" fill="#55d6ff"> createSystem</text>
    <text x="214" y="260" fill="#c9d1d9">({</text>

    <text x="31" y="278" fill="#5f6873">02</text>
    <text x="66" y="278" fill="#c9d1d9">web:</text>
    <text x="91" y="278" fill="#a5d6ff"> "production"</text>
    <text x="161" y="278" fill="#7d8590">,</text>

    <text x="31" y="296" fill="#5f6873">03</text>
    <text x="66" y="296" fill="#c9d1d9">ai:</text>
    <text x="85" y="296" fill="#a5d6ff"> "edge + applied"</text>
    <text x="177" y="296" fill="#7d8590">,</text>

    <text x="31" y="314" fill="#5f6873">04</text>
    <text x="66" y="314" fill="#c9d1d9">autonomy:</text>
    <text x="122" y="314" fill="#a5d6ff"> "sensor fusion"</text>
    <text x="209" y="314" fill="#7d8590">,</text>

    <text x="31" y="332" fill="#5f6873">05</text>
    <text x="66" y="332" fill="#c9d1d9">security:</text>
    <text x="122" y="332" fill="#a5d6ff"> "by design"</text>

    <text x="31" y="350" fill="#5f6873">06</text>
    <text x="54" y="350" fill="#c9d1d9">});</text>
    <text x="88" y="350" fill="#4fd18b">// ship → measure → improve</text>
  </g>

  <!-- architecture strip -->
  <text x="23" y="389" fill="#737b86" font-family="Consolas,Menlo,monospace" font-size="8.5" letter-spacing="1">SYSTEM ARCHITECTURE</text>

  <g font-family="Consolas,Menlo,monospace" font-size="8.2" text-anchor="middle">
    <rect x="20" y="404" width="69" height="42" rx="9" fill="#0b1016" stroke="#3d4b5b"/>
    <text x="54.5" y="422" fill="#55d6ff">FRONTEND</text>
    <text x="54.5" y="436" fill="#7e8792">React / Next</text>

    <rect x="103" y="404" width="69" height="42" rx="9" fill="#0b1016" stroke="#66551f"/>
    <text x="137.5" y="422" fill="#f2d36b">BACKEND</text>
    <text x="137.5" y="436" fill="#7e8792">Node / PHP</text>

    <rect x="186" y="404" width="69" height="42" rx="9" fill="#0b1016" stroke="#3d4b5b"/>
    <text x="220.5" y="422" fill="#55d6ff">AI / EDGE</text>
    <text x="220.5" y="436" fill="#7e8792">ML / Vision</text>

    <rect x="269" y="404" width="81" height="42" rx="9" fill="#0b1016" stroke="#66551f"/>
    <text x="309.5" y="422" fill="#f2d36b">AUTONOMY</text>
    <text x="309.5" y="436" fill="#7e8792">Fusion / ROS</text>
  </g>

  <path d="M89 425h14M172 425h14M255 425h14" stroke="#48515c" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="96" cy="425" r="2" fill="#d4af37"/>
  <circle cx="179" cy="425" r="2" fill="#55d6ff"/>
  <circle cx="262" cy="425" r="2" fill="#d4af37"/>

  <!-- footer telemetry -->
  <rect x="19" y="467" width="332" height="35" rx="10" fill="#090d12" stroke="#252b33"/>
  <circle cx="32" cy="484.5" r="4" fill="#4fd18b"/>
  <text x="42" y="488" fill="#c9d1d9" font-family="Consolas,Menlo,monospace" font-size="8.5">STATUS: BUILDING</text>
  <text x="183" y="488" fill="#7e8792" font-family="Consolas,Menlo,monospace" font-size="8.5">PERF</text>
  <rect x="213" y="481" width="54" height="6" rx="3" fill="#1d232b"/>
  <rect x="213" y="481" width="45" height="6" rx="3" fill="url(#gold)"/>
  <text x="280" y="488" fill="#55d6ff" font-family="Consolas,Menlo,monospace" font-size="8.5">SECURE</text>

  <text x="185" y="513" text-anchor="middle" fill="#4e5660" font-family="Consolas,Menlo,monospace" font-size="7.5">smshagor-dev • build / research / secure / automate</text>
</svg>
