<svg xmlns="http://www.w3.org/2000/svg" width="370" height="520" viewBox="0 0 370 520" role="img" aria-labelledby="title desc">
<title id="title">Cipher Stack portrait terminal</title>
<desc id="desc">Fallback gold ASCII identity card. Run the portrait script to replace it with a portrait-based render.</desc>
<style>
  .a{fill:#D4AF37;font:8px "SFMono-Regular",Consolas,"Liberation Mono",monospace;white-space:pre;opacity:0;animation:fin .65s ease forwards}
  .l1{animation-delay:.1s}.l2{animation-delay:.2s}.l3{animation-delay:.3s}.l4{animation-delay:.4s}.l5{animation-delay:.5s}.l6{animation-delay:.6s}.l7{animation-delay:.7s}.l8{animation-delay:.8s}.l9{animation-delay:.9s}.l10{animation-delay:1s}.l11{animation-delay:1.1s}.l12{animation-delay:1.2s}.l13{animation-delay:1.3s}.l14{animation-delay:1.4s}.l15{animation-delay:1.5s}
  .cursor{animation:blink 1s step-end infinite}
  @keyframes fin{from{opacity:0;transform:translateY(3px)}to{opacity:.96;transform:translateY(0)}}
  @keyframes blink{50%{opacity:0}}
</style>
<rect x="1" y="1" width="368" height="518" rx="18" fill="#0d0d0d" stroke="#3b3218" stroke-width="2"/>
<circle cx="24" cy="25" r="5" fill="#ff5f57"/><circle cx="42" cy="25" r="5" fill="#febc2e"/><circle cx="60" cy="25" r="5" fill="#28c840"/>
<text x="185" y="30" text-anchor="middle" fill="#8b8b8b" font-size="11" font-family="monospace">portrait://cipher-stack</text>
<line x1="18" y1="47" x2="352" y2="47" stroke="#252525"/>
<g transform="translate(31 92)">
<text class="a l1" x="0" y="0">                .:+*###*+:.                </text>
<text class="a l2" x="0" y="15">            .+%@@@@@@@@@@@@%+.            </text>
<text class="a l3" x="0" y="30">          :%@@@@@%*++++*%@@@@@%:          </text>
<text class="a l4" x="0" y="45">        .%@@@@%+:        :+%@@@@%.        </text>
<text class="a l5" x="0" y="60">       +@@@@%:              :%@@@@+       </text>
<text class="a l6" x="0" y="75">      *@@@@+      .::::.      +@@@@*      </text>
<text class="a l7" x="0" y="90">     +@@@@*      +%@@@@%+      *@@@@+     </text>
<text class="a l8" x="0" y="105">     %@@@@:      %@%**%@%      :@@@@%     </text>
<text class="a l9" x="0" y="120">     %@@@@:       +####+       :@@@@%     </text>
<text class="a l10" x="0" y="135">     +@@@@*        :++:        *@@@@+     </text>
<text class="a l11" x="0" y="150">      *@@@@+.                .+@@@@*      </text>
<text class="a l12" x="0" y="165">       +@@@@@%+:          :+%@@@@@+       </text>
<text class="a l13" x="0" y="180">         *@@@@@@@@%%%%@@@@@@@@*           </text>
<text class="a l14" x="0" y="195">            :+%@@@@@@@@%+:                </text>
<text class="a l15" x="0" y="226">       SHAHANUR ISLAM SHAGOR // 0xAI       </text>
</g>
<text x="24" y="479" fill="#777" font-size="10" font-family="monospace">portrait source: local-only</text>
<text x="24" y="500" fill="#777" font-size="10" font-family="monospace">$ render --identity shagor <tspan class="cursor" fill="#D4AF37">▋</tspan></text>
</svg>
