<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">Shahanur Islam Shagor — Professional Engineering Profile</title>
<desc id="desc">Animated GitHub profile hero for a Full-Stack Developer and AI / Autonomous Systems Engineer with primary programming languages, production software, edge AI, robotics, security and research.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070a"/><stop offset=".52" stop-color="#0b0f14"/><stop offset="1" stop-color="#06080b"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8d6b16"/><stop offset=".5" stop-color="#f0ca55"/><stop offset="1" stop-color="#a97c18"/></linearGradient>
  <linearGradient id="goldFade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d4af37" stop-opacity="0"/><stop offset=".5" stop-color="#d4af37" stop-opacity=".85"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#d4af37" stop-opacity=".10"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d4af37" stroke-opacity=".025"/></pattern>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
  <style>
    .mono{font-family:Consolas,Menlo,"Liberation Mono",monospace}.sans{font-family:Inter,"Segoe UI",Arial,sans-serif}.muted{fill:#7d8590}.text{fill:#f0f3f6}.gold{fill:#d4af37}.cyan{fill:#62c9ee}.green{fill:#4fd18b}
    .signal{stroke-dasharray:8 16;animation:dash 9s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.7s ease-in-out infinite}.blink{animation:blink 1.05s step-end infinite}.scan{animation:scan 7s ease-in-out infinite}.fade1{animation:fade 4.5s ease-in-out infinite}.fade2{animation:fade 4.5s ease-in-out 1.4s infinite}.fade3{animation:fade 4.5s ease-in-out 2.8s infinite}.sweep{animation:sweep 5s ease-in-out infinite}.lang{animation:lang 5.6s ease-in-out infinite}.l1{animation-delay:0s}.l2{animation-delay:.8s}.l3{animation-delay:1.6s}.l4{animation-delay:2.4s}.l5{animation-delay:3.2s}.l6{animation-delay:4s}.l7{animation-delay:4.8s}.rail{animation:rail 8s ease-in-out infinite}
    @keyframes dash{to{stroke-dashoffset:-240}}@keyframes pulse{0%,100%{opacity:.55;transform:scale(.86)}50%{opacity:1;transform:scale(1.16)}}@keyframes blink{50%{opacity:0}}@keyframes scan{0%,100%{transform:translateY(-42px);opacity:0}14%{opacity:.2}50%{transform:translateY(300px);opacity:.14}86%{opacity:.18}}@keyframes fade{0%,100%{opacity:.28}50%{opacity:.9}}@keyframes sweep{0%,100%{transform:translateX(-210px);opacity:0}18%{opacity:.9}52%{transform:translateX(220px);opacity:.7}70%{opacity:0}}@keyframes lang{0%,70%,100%{opacity:.52}12%,34%{opacity:1}}@keyframes rail{0%,100%{transform:translateX(-455px);opacity:0}12%{opacity:.65}50%{transform:translateX(455px);opacity:.7}88%{opacity:.15}}
    @media (prefers-reduced-motion:reduce){.signal,.pulse,.blink,.scan,.fade1,.fade2,.fade3,.sweep,.lang,.rail{animation:none!important}}
  </style>
</defs>

<rect x="1" y="1" width="998" height="478" rx="24" fill="url(#bg)" stroke="#2a2f36" stroke-width="2"/>
<rect x="1" y="1" width="998" height="478" rx="24" fill="url(#grid)"/>
<ellipse cx="500" cy="150" rx="330" ry="185" fill="url(#halo)"/>

<g fill="none" stroke-linecap="round">
  <path d="M0 126H116l34-34h112" stroke="#39434d" stroke-width="1.2"/><path d="M0 126H116l34-34h112" class="signal" stroke="#62c9ee" stroke-opacity=".34"/>
  <path d="M0 332h126l28-30h96" stroke="#4b3d17" stroke-width="1.2"/><path d="M0 332h126l28-30h96" class="signal" stroke="#d4af37" stroke-opacity=".46"/>
  <path d="M1000 126H884l-34-34H738" stroke="#39434d" stroke-width="1.2"/><path d="M1000 126H884l-34-34H738" class="signal" stroke="#62c9ee" stroke-opacity=".34"/>
  <path d="M1000 332H874l-28-30h-96" stroke="#4b3d17" stroke-width="1.2"/><path d="M1000 332H874l-28-30h-96" class="signal" stroke="#d4af37" stroke-opacity=".46"/>
</g>
<g><circle cx="150" cy="92" r="3" fill="#62c9ee" class="fade1"/><circle cx="154" cy="302" r="3" fill="#d4af37" class="fade2"/><circle cx="850" cy="92" r="3" fill="#62c9ee" class="fade3"/><circle cx="846" cy="302" r="3" fill="#d4af37" class="fade1"/></g>

<g class="mono" font-size="10" letter-spacing="1.25"><circle cx="38" cy="32" r="4" fill="#4fd18b" class="pulse"/><text x="51" y="36" class="muted">ENGINEERING PROFILE / smshagor-dev</text><text x="962" y="36" text-anchor="end" class="green">SYSTEM ONLINE</text></g>
<line x1="28" y1="52" x2="972" y2="52" stroke="#222831"/>

<text x="500" y="136" text-anchor="middle" class="sans text" font-size="48" font-weight="750" letter-spacing="-.5">Shahanur <tspan fill="#d4af37">Islam</tspan> Shagor</text>
<rect x="330" y="156" width="340" height="2" rx="1" fill="#252b32"/><rect x="430" y="156" width="140" height="2" rx="1" fill="url(#gold)"/><rect x="464" y="155" width="72" height="4" rx="2" fill="#f0ca55" opacity=".18" filter="url(#soft)"/><rect x="430" y="155" width="140" height="4" rx="2" fill="url(#goldFade)" class="sweep"/>
<text x="500" y="195" text-anchor="middle" class="sans" fill="#c9d1d9" font-size="20" font-weight="500">Full-Stack Developer <tspan fill="#d4af37">|</tspan> AI / Autonomous Systems Engineer</text>
<text x="500" y="220" text-anchor="middle" class="mono muted" font-size="10.5" letter-spacing="1.05">PRODUCTION SOFTWARE · EDGE AI · ROBOTICS · SECURITY · APPLIED RESEARCH</text>

<!-- animated primary programming languages -->
<text x="500" y="250" text-anchor="middle" class="mono muted" font-size="8.5" letter-spacing="1.5">PRIMARY PROGRAMMING LANGUAGES</text>
