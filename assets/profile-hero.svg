    .signal{stroke-dasharray:8 16;animation:dash 9s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.7s ease-in-out infinite}.scan{animation:scan 7s ease-in-out infinite}.fade1{animation:fade 4.5s ease-in-out infinite}.fade2{animation:fade 4.5s ease-in-out 1.4s infinite}.fade3{animation:fade 4.5s ease-in-out 2.8s infinite}.sweep{animation:sweep 5s ease-in-out infinite}.lang{animation:lang 5.6s ease-in-out infinite}.l1{animation-delay:0s}.l2{animation-delay:.7s}.l3{animation-delay:1.4s}.l4{animation-delay:2.1s}.l5{animation-delay:2.8s}.l6{animation-delay:3.5s}.l7{animation-delay:4.2s}
    @keyframes dash{to{stroke-dashoffset:-240}}@keyframes pulse{0%,100%{opacity:.55;transform:scale(.86)}50%{opacity:1;transform:scale(1.16)}}@keyframes scan{0%,100%{transform:translateY(-42px);opacity:0}14%{opacity:.2}50%{transform:translateY(345px);opacity:.14}86%{opacity:.18}}@keyframes fade{0%,100%{opacity:.28}50%{opacity:.9}}@keyframes sweep{0%,100%{transform:translateX(-210px);opacity:0}18%{opacity:.9}52%{transform:translateX(220px);opacity:.7}70%{opacity:0}}@keyframes lang{0%,70%,100%{opacity:.55}12%,34%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.signal,.pulse,.scan,.fade1,.fade2,.fade3,.sweep,.lang{animation:none!important}}
  </style>
</defs>
