<rect x="148" y="271" width="704" height="24" rx="8" fill="#0a0f15"/>
<g class="mono" font-size="10" text-anchor="middle">
  <g class="lang l1"><rect x="161" y="273" width="86" height="20" rx="7" fill="#10161d" stroke="#3f4d59"/><text x="204" y="286" class="cyan">TypeScript</text></g>
  <g class="lang l2"><rect x="255" y="273" width="92" height="20" rx="7" fill="#10161d" stroke="#4d401b"/><text x="301" y="286" class="gold">JavaScript</text></g>
  <g class="lang l3"><rect x="355" y="273" width="78" height="20" rx="7" fill="#10161d" stroke="#3f4d59"/><text x="394" y="286" class="cyan">Python</text></g>
  <g class="lang l4"><rect x="441" y="273" width="72" height="20" rx="7" fill="#10161d" stroke="#4d401b"/><text x="477" y="286" class="gold">C++20</text></g>
  <g class="lang l5"><rect x="521" y="273" width="58" height="20" rx="7" fill="#10161d" stroke="#3f4d59"/><text x="550" y="286" class="cyan">Go</text></g>
  <g class="lang l6"><rect x="587" y="273" width="58" height="20" rx="7" fill="#10161d" stroke="#4d401b"/><text x="616" y="286" class="gold">PHP</text></g>
  <g class="lang l7"><rect x="653" y="273" width="64" height="20" rx="7" fill="#10161d" stroke="#3f4d59"/><text x="685" y="286" class="cyan">SQL</text></g>
</g>
<rect x="495" y="299" width="10" height="2" rx="1" fill="#d4af37" class="rail"/>

<g class="mono" font-size="9.5">
  <rect x="176" y="326" width="190" height="45" rx="12" fill="#0a0e13" stroke="#28303a"/><circle cx="199" cy="348.5" r="5" fill="#4fd18b" class="pulse"/><text x="215" y="352" class="text">OPEN TO OPPORTUNITIES</text>
  <rect x="385" y="326" width="230" height="45" rx="12" fill="#0a0e13" stroke="#4c401c"/><path d="M412 339c-7 0-12 5-12 12 0 8 12 17 12 17s12-9 12-17c0-7-5-12-12-12zm0 7a5 5 0 110 10 5 5 0 010-10z" fill="#d4af37" opacity=".9" transform="translate(0 -3) scale(.82) translate(90 78)"/><text x="437" y="352" class="text">VORONEZH, RUSSIA · UTC+3</text>
  <rect x="634" y="326" width="190" height="45" rx="12" fill="#0a0e13" stroke="#28303a"/><path d="M657 340h13v13h-13zm3-6h7v5h-7z" fill="none" stroke="#62c9ee" stroke-width="1.5"/><text x="681" y="352" class="text">BUILD · RESEARCH · SHIP</text>
</g>

<rect x="142" y="392" width="716" height="55" rx="13" fill="#080c11" stroke="#252c34"/><path d="M142 404v31" stroke="#d4af37" stroke-width="3"/><text x="168" y="426" class="mono gold" font-size="14">&gt;_</text><text x="207" y="426" class="mono" fill="#d7dce2" font-size="13.5">Building scalable software, intelligent systems, and resilient autonomy.</text><rect x="818" y="412" width="8" height="19" rx="1" fill="#d4af37" class="blink"/>

<g class="scan"><rect x="22" y="82" width="956" height="1" fill="#62c9ee" opacity=".25"/><rect x="390" y="80" width="220" height="5" fill="#62c9ee" opacity=".035" filter="url(#soft)"/></g>
<text x="500" y="467" text-anchor="middle" class="mono" fill="#4d5660" font-size="8.5" letter-spacing="1">SECURITY BY DESIGN · MEASURABLE PERFORMANCE · MAINTAINABLE SYSTEMS</text>
</svg>