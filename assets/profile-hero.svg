<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Shahanur Islam Shagor — Professional Engineering Profile</title>
<desc id="desc">Animated GitHub profile hero for a Full-Stack Developer and AI / Autonomous Systems Engineer focused on production software, edge AI, robotics, security and research.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070a"/><stop offset=".52" stop-color="#0b0f14"/><stop offset="1" stop-color="#06080b"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8d6b16"/><stop offset=".5" stop-color="#f0ca55"/><stop offset="1" stop-color="#a97c18"/></linearGradient>
  <linearGradient id="goldFade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d4af37" stop-opacity="0"/><stop offset=".5" stop-color="#d4af37" stop-opacity=".85"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#d4af37" stop-opacity=".10"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d4af37" stroke-opacity=".025"/></pattern>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
  <style>
    .mono{font-family:Consolas,Menlo,"Liberation Mono",monospace}.sans{font-family:Inter,"Segoe UI",Arial,sans-serif}.muted{fill:#7d8590}.text{fill:#f0f3f6}.gold{fill:#d4af37}.cyan{fill:#62c9ee}.green{fill:#4fd18b}
    .signal{stroke-dasharray:8 16;animation:dash 9s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.7s ease-in-out infinite}.blink{animation:blink 1.05s step-end infinite}.scan{animation:scan 6s ease-in-out infinite}.fade1{animation:fade 4.5s ease-in-out infinite}.fade2{animation:fade 4.5s ease-in-out 1.4s infinite}.fade3{animation:fade 4.5s ease-in-out 2.8s infinite}.sweep{animation:sweep 5s ease-in-out infinite}
    @keyframes dash{to{stroke-dashoffset:-240}}@keyframes pulse{0%,100%{opacity:.55;transform:scale(.86)}50%{opacity:1;transform:scale(1.16)}}@keyframes blink{50%{opacity:0}}@keyframes scan{0%,100%{transform:translateY(-32px);opacity:0}15%{opacity:.26}50%{transform:translateY(245px);opacity:.18}85%{opacity:.2}}@keyframes fade{0%,100%{opacity:.28}50%{opacity:.9}}@keyframes sweep{0%,100%{transform:translateX(-210px);opacity:0}18%{opacity:.9}52%{transform:translateX(220px);opacity:.7}70%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.signal,.pulse,.blink,.scan,.fade1,.fade2,.fade3,.sweep{animation:none!important}}
  </style>
</defs>

<rect x="1" y="1" width="998" height="418" rx="24" fill="url(#bg)" stroke="#2a2f36" stroke-width="2"/>
<rect x="1" y="1" width="998" height="418" rx="24" fill="url(#grid)"/>
<ellipse cx="500" cy="155" rx="330" ry="185" fill="url(#halo)"/>

<!-- restrained circuit field -->
<g fill="none" stroke-linecap="round">
  <path d="M0 126H116l34-34h112" stroke="#39434d" stroke-width="1.2"/><path d="M0 126H116l34-34h112" class="signal" stroke="#62c9ee" stroke-opacity=".34"/>
  <path d="M0 302h126l28-30h96" stroke="#4b3d17" stroke-width="1.2"/><path d="M0 302h126l28-30h96" class="signal" stroke="#d4af37" stroke-opacity=".46"/>
  <path d="M1000 126H884l-34-34H738" stroke="#39434d" stroke-width="1.2"/><path d="M1000 126H884l-34-34H738" class="signal" stroke="#62c9ee" stroke-opacity=".34"/>
  <path d="M1000 302H874l-28-30h-96" stroke="#4b3d17" stroke-width="1.2"/><path d="M1000 302H874l-28-30h-96" class="signal" stroke="#d4af37" stroke-opacity=".46"/>
</g>
<g><circle cx="150" cy="92" r="3" fill="#62c9ee" class="fade1"/><circle cx="154" cy="272" r="3" fill="#d4af37" class="fade2"/><circle cx="850" cy="92" r="3" fill="#62c9ee" class="fade3"/><circle cx="846" cy="272" r="3" fill="#d4af37" class="fade1"/></g>

<!-- top system line -->
<g class="mono" font-size="10" letter-spacing="1.25"><circle cx="38" cy="32" r="4" fill="#4fd18b" class="pulse"/><text x="51" y="36" class="muted">ENGINEERING PROFILE / smshagor-dev</text><text x="962" y="36" text-anchor="end" class="green">SYSTEM ONLINE</text></g>
<line x1="28" y1="52" x2="972" y2="52" stroke="#222831"/>

<!-- headline -->
<text x="500" y="139" text-anchor="middle" class="sans text" font-size="48" font-weight="750" letter-spacing="-.5">Shahanur <tspan fill="#d4af37">Islam</tspan> Shagor</text>
<rect x="330" y="159" width="340" height="2" rx="1" fill="#252b32"/><rect x="430" y="159" width="140" height="2" rx="1" fill="url(#gold)"/>
<rect x="464" y="158" width="72" height="4" rx="2" fill="#f0ca55" opacity=".18" filter="url(#soft)"/>
<rect x="430" y="158" width="140" height="4" rx="2" fill="url(#goldFade)" class="sweep"/>
<text x="500" y="199" text-anchor="middle" class="sans" fill="#c9d1d9" font-size="20" font-weight="500">Full-Stack Developer <tspan fill="#d4af37">|</tspan> AI / Autonomous Systems Engineer</text>
<text x="500" y="225" text-anchor="middle" class="mono muted" font-size="11" letter-spacing="1.1">PRODUCTION SOFTWARE · EDGE AI · ROBOTICS · SECURITY · APPLIED RESEARCH</text>

<!-- status strip -->
<g class="mono" font-size="10">
  <rect x="176" y="257" width="190" height="48" rx="12" fill="#0a0e13" stroke="#28303a"/><circle cx="199" cy="281" r="5" fill="#4fd18b" class="pulse"/><text x="215" y="285" class="text">OPEN TO OPPORTUNITIES</text>
  <rect x="385" y="257" width="230" height="48" rx="12" fill="#0a0e13" stroke="#4c401c"/><path d="M412 272c-7 0-12 5-12 12 0 8 12 17 12 17s12-9 12-17c0-7-5-12-12-12zm0 7a5 5 0 110 10 5 5 0 010-10z" fill="#d4af37" opacity=".9"/><text x="437" y="285" class="text">VORONEZH, RUSSIA · UTC+3</text>
  <rect x="634" y="257" width="190" height="48" rx="12" fill="#0a0e13" stroke="#28303a"/><path d="M657 273h13v13h-13zm3-6h7v5h-7z" fill="none" stroke="#62c9ee" stroke-width="1.5"/><text x="681" y="285" class="text">BUILD · RESEARCH · SHIP</text>
</g>

<!-- terminal statement -->
<rect x="142" y="330" width="716" height="58" rx="13" fill="#080c11" stroke="#252c34"/>
<path d="M142 343v32" stroke="#d4af37" stroke-width="3"/>
<text x="168" y="365" class="mono gold" font-size="14">&gt;_</text><text x="207" y="365" class="mono" fill="#d7dce2" font-size="14">Building scalable software, intelligent systems, and resilient autonomy.</text><rect x="819" y="350" width="8" height="20" rx="1" fill="#d4af37" class="blink"/>

<!-- scan accent -->
<g class="scan"><rect x="22" y="82" width="956" height="1" fill="#62c9ee" opacity=".25"/><rect x="390" y="80" width="220" height="5" fill="#62c9ee" opacity=".035" filter="url(#soft)"/></g>
<text x="500" y="408" text-anchor="middle" class="mono" fill="#4d5660" font-size="8.5" letter-spacing="1">SECURITY BY DESIGN · MEASURABLE PERFORMANCE · MAINTAINABLE SYSTEMS</text>
</svg>